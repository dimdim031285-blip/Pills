<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблетки — дневник приёма</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#17202a; --muted:#68737d; --line:#dfe4e8; --accent:#2878d8; --ok:#e9f7ed; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
  .wrap{max-width:1100px;margin:auto;padding:14px}
  .top{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 10px #00000010;margin-bottom:12px}
  h1{font-size:22px;margin:0 0 10px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button{font:inherit}
  input[type=date],input[type=text],input[type=time]{border:1px solid var(--line);border-radius:8px;padding:8px;background:white}
  button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer}
  .primary{background:var(--accent);color:white}.secondary{background:#edf1f4}.danger{background:#ffe8e8;color:#a40000}
  .tablebox{background:var(--card);border-radius:14px;box-shadow:0 2px 10px #00000010;overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:center;vertical-align:middle}
  th{background:#f8fafb;position:sticky;top:0;z-index:1;font-size:13px}
  td:first-child,th:first-child{text-align:left}
  .med{font-weight:700}
  .dose{font-size:12px;color:var(--muted);font-weight:normal;margin-top:3px}
  .slot{display:flex;flex-direction:column;gap:4px;align-items:center}
  .slot input[type=checkbox]{width:22px;height:22px;accent-color:#27a64a;cursor:pointer}
  .taken{font-size:12px;color:#24763b;min-height:14px}
  tr.completed{background:var(--ok)}
  .summary{color:var(--muted);font-size:13px;margin-top:9px}
  .empty{padding:35px;text-align:center;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);line-height:1.4}
  dialog{border:0;border-radius:14px;padding:0;width:min(500px,92vw);box-shadow:0 10px 50px #0005}
  dialog::backdrop{background:#0006}
  .dlg{padding:18px}.dlg h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .times{display:flex;flex-wrap:wrap;gap:7px}.timeRow{display:flex;gap:5px;align-items:center}
  @media(max-width:650px){.wrap{padding:8px}h1{font-size:19px}th,td{padding:8px 5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>💊 Таблетки — дневник приёма</h1>
    <div class="bar">
      <label>Дата: <input id="date" type="date"></label>
      <button class="primary" onclick="openAdd()">＋ Добавить препарат</button>
      <button class="secondary" onclick="clearDay()">Очистить отметки за день</button>
      <button class="secondary" onclick="exportData()">Сохранить данные</button>
      <button class="secondary" onclick="document.getElementById('file').click()">Загрузить</button>
      <input id="file" type="file" accept=".json" hidden onchange="importData(event)">
    </div>
    <div class="summary" id="summary"></div>
  </div>

  <div class="tablebox">
    <table>
      <thead><tr><th>Препарат</th><th>Приём 1</th><th>Приём 2</th><th>Приём 3</th><th>Приём 4</th><th>Действия</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">Добавьте препараты кнопкой выше.</div>
  </div>

  <div class="top" style="margin-top:12px">
    <div class="hint">
      Отметьте галочку после фактического приёма. Время автоматически запишется текущее.
      Данные сохраняются прямо в браузере на этом устройстве. Интернет для работы не нужен.
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg">
    <h2 id="dlgTitle">Добавить препарат</h2>
    <div class="field"><label>Название</label><input id="name" type="text" placeholder="Например: Вертинекс" style="width:100%"></div>
    <div class="field"><label>Дозировка / примечание</label><input id="dose" type="text" placeholder="Например: 1 таблетка" style="width:100%"></div>
    <div class="field"><label>Количество приёмов в день</label>
      <select id="count" onchange="renderTimeInputs()" style="padding:8px;border:1px solid var(--line);border-radius:8px">
        <option>1</option><option>2</option><option>3</option><option>4</option>
      </select>
    </div>
    <div class="field"><label>Плановое время (не обязательно)</label><div id="times" class="times"></div></div>
    <div class="bar" style="justify-content:flex-end">
      <button class="secondary" onclick="dlg.close()">Отмена</button>
      <button class="primary" onclick="saveMed()">Сохранить</button>
    </div>
  </div>
</dialog>

<script>
const KEY='tabletDiary_v1';
let meds=JSON.parse(localStorage.getItem(KEY)||'[]');
let editId=null;

const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
$('date').value=today();
$('date').addEventListener('change',render);

function save(){localStorage.setItem(KEY,JSON.stringify(meds));}
function dateKey(){return $('date').value}

function render(){
  const tbody=$('body'); tbody.innerHTML='';
  if(!meds.length){$('empty').style.display='block';$('summary').textContent='Препаратов пока нет.';return}
  $('empty').style.display='none';
  let total=0,taken=0;
  meds.forEach(m=>{
    const tr=document.createElement('tr');
    let html=`<td><div class="med">${esc(m.name)}</div>${m.dose?`<div class="dose">${esc(m.dose)}</div>`:''}</td>`;
    for(let i=0;i<4;i++){
      if(i<m.times.length){
        total++;
        const rec=m.records?.[dateKey()]?.[i];
        if(rec) taken++;
        html+=`<td><div class="slot">
          <input type="checkbox" ${rec?'checked':''} onchange="toggle('${m.id}',${i},this)">
          <div class="taken">${rec?esc(rec):''}</div>
          <div class="dose">${m.times[i]||''}</div>
        </div></td>`;
      }else html+='<td>—</td>';
    }
    html+=`<td><div class="bar" style="justify-content:center">
      <button class="secondary" onclick="editMed('${m.id}')">Изм.</button>
      <button class="danger" onclick="deleteMed('${m.id}')">Удал.</button>
    </div></td>`;
    tr.innerHTML=html;
    if(m.times.length && m.times.every((_,i)=>m.records?.[dateKey()]?.[i])) tr.className='completed';
    tbody.appendChild(tr);
  });
  $('summary').textContent=`За ${dateKey().split('-').reverse().join('.')} принято: ${taken} из ${total} запланированных приёмов.`;
}

function toggle(id,i,el){
  const m=meds.find(x=>x.id===id); if(!m.records)m.records={};
  if(!m.records[dateKey()])m.records[dateKey()]={};
  if(el.checked){
    m.records[dateKey()][i]=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  }else delete m.records[dateKey()][i];
  save();render();
}

function openAdd(){
  editId=null;$('dlgTitle').textContent='Добавить препарат';$('name').value='';$('dose').value='';$('count').value='1';renderTimeInputs();$('dlg').showModal();
}
function renderTimeInputs(values){
  const n=+$('count').value, box=$('times'); box.innerHTML='';
  const defaults=['08:00','13:00','18:00','22:00'];
  for(let i=0;i<n;i++){
    const row=document.createElement('div');row.className='timeRow';
    row.innerHTML=`<span>${i+1}.</span><input type="time" id="t${i}" value="${values?.[i]||defaults[i]}">`;
    box.appendChild(row);
  }
}
function saveMed(){
  const name=$('name').value.trim();if(!name){alert('Введите название препарата.');return}
  const times=[...document.querySelectorAll('#times input')].map(x=>x.value);
  if(editId){
    const m=meds.find(x=>x.id===editId);m.name=name;m.dose=$('dose').value.trim();m.times=times;
  }else meds.push({id:crypto.randomUUID(),name,dose:$('dose').value.trim(),times,records:{}});
  save();$('dlg').close();render();
}
function editMed(id){
  const m=meds.find(x=>x.id===id);editId=id;$('dlgTitle').textContent='Изменить препарат';
  $('name').value=m.name;$('dose').value=m.dose||'';$('count').value=m.times.length;renderTimeInputs(m.times);$('dlg').showModal();
}
function deleteMed(id){
  const m=meds.find(x=>x.id===id);
  if(confirm(`Удалить «${m.name}»?`)){meds=meds.filter(x=>x.id!==id);save();render();}
}
function clearDay(){
  if(!confirm('Удалить все отметки о приёме за выбранный день?'))return;
  meds.forEach(m=>{if(m.records)delete m.records[dateKey()]});save();render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(meds,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tablet-diary-backup.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{meds=JSON.parse(r.result);save();render();}catch{alert('Файл не удалось загрузить.');}};r.readAsText(f);e.target.value='';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script>
</body>
</html>
